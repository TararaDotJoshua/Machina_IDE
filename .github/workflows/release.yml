name: Publish Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify stable release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = "v$version"
          if ('${{ github.ref_name }}' -ne $expected) {
            throw "Tag '${{ github.ref_name }}' must match package version '$expected'."
          }
          if ($version.Contains('-')) {
            throw "Production releases require a stable semantic version."
          }

      - name: Require Windows signing credentials
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) {
            throw "Configure WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD before publishing."
          }

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run lint

      - name: Build and publish signed release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Verify updater assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "release/Machina-IDE-$version-Windows-x64.exe"
          $blockmap = "$installer.blockmap"
          $metadata = "release/latest.yml"
          gh release upload "${{ github.ref_name }}" $installer $blockmap $metadata --clobber

          $published = gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name'
          @(
            "Machina-IDE-$version-Windows-x64.exe",
            "Machina-IDE-$version-Windows-x64.exe.blockmap",
            "latest.yml"
          ) | ForEach-Object {
            if ($_ -notin $published) { throw "Required release asset was not published: $_" }
          }
