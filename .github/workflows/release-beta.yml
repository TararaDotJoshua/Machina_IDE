name: Publish Windows Beta

on:
  push:
    tags:
      - 'v*-beta.*'

permissions:
  contents: write

jobs:
  publish-windows-beta:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = "v$version"
          if ('${{ github.ref_name }}' -ne $expected) {
            throw "Tag '${{ github.ref_name }}' must match package version '$expected'."
          }

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and publish beta
        run: npm run release:beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure every updater asset is published
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "release/Machina-IDE-$version-Windows-x64.exe"
          $blockmap = "$installer.blockmap"
          $metadata = "release/beta.yml"
          gh release upload "${{ github.ref_name }}" $installer $blockmap $metadata --clobber

          $published = gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name'
          @(
            "Machina-IDE-$version-Windows-x64.exe",
            "Machina-IDE-$version-Windows-x64.exe.blockmap",
            "beta.yml"
          ) | ForEach-Object {
            if ($_ -notin $published) { throw "Required release asset was not published: $_" }
          }
